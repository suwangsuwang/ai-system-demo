services:
  nginx:
    image: nginx:latest
    container_name: nginx-gateway
    ports:
      - "8089:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    image: springboot-demo:v2
    container_name: springboot-app
    ports:
      - "8082:8081"

  redis:
    image: redis:latest
    container_name: redis-demo
    ports:
      - "6379:6379"
